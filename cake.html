<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Make A Wish!</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Notebook Green Theme */
            --theme-bg: #4a5d4e; 
            --theme-text: #6b8e6f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body {
            margin: 0;
            background: radial-gradient(circle at center, #2c3540 0%, #0a0e14 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            transition: background 1.5s ease-in-out;
        }

        /* When the cake is cut, transition to the Notebook theme! */
        body.party-mode {
            background: var(--theme-bg);
        }

        /* --- CINEMATIC LOADER --- */
        #cinematic-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0e14;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
        }

        #cinematic-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-text {
            font-family: 'Pacifico', cursive;
            font-size: 1.8rem;
            color: #fff;
            letter-spacing: 2px;
            animation: pulseGlow 1.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
            50% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,0.8); }
        }

        .prompt-text {
            position: absolute;
            top: 15vh;
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 2px 10px rgba(255,255,255,0.3);
            text-align: center;
            z-index: 10;
            transition: opacity 0.4s ease;
            animation: gentlePulse 2s infinite ease-in-out;
        }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* --- THE CAKE SPLIT MECHANISM --- */
        .cake-wrapper {
            position: relative;
            width: 450px;
            height: 450px;
            z-index: 10;
            cursor: ns-resize; 
            touch-action: none; 
            margin-top: 5vh;
            /* BOUNCY ANIMATION REMOVED SO IT STAYS STILL */
        }

        .cake-half {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .left-half {
            clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
        }

        .right-half {
            clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.3));
        }

        /* --- NEW ANIMATED CANDLE FLAMES --- */
        .flame {
            transform-box: fill-box;
            transform-origin: center bottom; /* Anchors the animation to the bottom of the flame */
            animation: flicker 0.15s infinite alternate ease-in-out;
            transition: opacity 0.5s ease-out;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.05, 1.15) rotate(2deg); }
            100% { transform: scale(0.95, 1.1) rotate(-1deg); }
        }

        body.party-mode .left-half {
            transform: translateX(-75px) translateY(10px) rotate(-6deg);
        }

        body.party-mode .right-half {
            transform: translateX(75px) translateY(10px) rotate(6deg);
        }

        body.party-mode .flame {
            opacity: 0; 
            animation: none; /* Stops the flickering after being blown out */
        }

        /* --- THE SURPRISE REVEAL --- */
        .reveal-container {
            position: absolute;
            bottom: 10vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transform: translateY(40px) scale(0.8);
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s;
        }

        body.party-mode .reveal-container {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0) scale(1);
        }

        .surprise-sticker {
            width: 110px;
            height: 110px;
            background: url('200w (2).webp') center/contain no-repeat;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
            animation: floatSticker 3s ease-in-out infinite;
        }

        @keyframes floatSticker {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 30px;
            border-radius: 30px; 
            background-color: rgba(255, 255, 255, 0.95); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); 
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .btn-link:hover {
            background-color: #fff;
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 0 15px rgba(107, 142, 111, 0.2);
        }
        
        .btn-link:active {
            transform: translateY(2px) scale(0.95);
        }

        .btn-text {
            font-family: 'Pacifico', cursive;
            font-size: 1.5rem;
            letter-spacing: 1.5px;
            color: var(--theme-text); 
        }

        #slice-line {
            position: fixed;
            top: 0;
            width: 4px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.9), #fff);
            box-shadow: 0 0 15px #fff;
            border-radius: 5px;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transform-origin: top center;
        }

        @media (max-width: 480px) {
            .cake-wrapper { width: 350px; height: 350px; }
            .prompt-text { font-size: 1.8rem; }
            .reveal-container { bottom: 8vh; }
        }
    </style>
</head>
<body>

    <!-- Cinematic Loader -->

        <div class="loader-text">Lighting the candles...</div>
    </div>

    <div id="slice-line"></div>

                <rect x="252" y="90" width="16" height="80" fill="url(#stripe-left)" rx="3" ry="3"/>
                <g class="flame">
                    <path d="M 260 70 Q 266 80 260 86 Q 254 80 260 70" fill="#ffffff"/>
                    <circle cx="260" cy="60" r="1.5" fill="#ffffff" opacity="0.9"/>
                    <circle cx="260" cy="50" r="2.5" fill="#ffffff" opacity="0.7"/>
                    <circle cx="260" cy="40" r="1" fill="#ffffff" opacity="0.5"/>
                </g>

                <path d="M 69 180 A 131 35 0 0 0 331 180" fill="none" stroke="#fff5e4" stroke-width="34" stroke-linecap="round" stroke-dasharray="0 7.14" pathLength="100" />
                <path d="M 75 194 A 125 35 0 0 0 325 194" fill="none" stroke="#f05d54" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 7.14" stroke-dashoffset="-3.57" pathLength="100" />
                
                <text x="130" y="240" font-size="45" text-anchor="middle">🎀</text>

                <text x="200" y="275" fill="#ffffff" font-family="'Itim', cursive" font-size="32" text-anchor="middle" letter-spacing="2">HAPPY</text>
                <text x="200" y="315" fill="#ffffff" font-family="'Itim', cursive" font-size="32" text-anchor="middle" letter-spacing="2">BIRTHDAY</text>
            </svg>
        </div>

        <!-- RIGHT HALF OF CAKE -->
        <div class="cake-half right-half">
            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="stripe-right" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
                        <rect x="0" y="0" width="16" height="6" fill="#ffffff" fill-opacity="0.95"/>
                    </pattern>
                </defs>
                <ellipse cx="200" cy="330" rx="140" ry="32" fill="#e3d0a6" opacity="0.6"/>
                <path d="M 69 180 L 69 325 A 131 35 0 0 0 331 325 L 331 180 Z" fill="#9ba0e3" />
                <ellipse cx="200" cy="180" rx="131" ry="35" fill="#acb0eb" />
                
                <path d="M 69 180 A 131 35 0 0 1 331 180" fill="none" stroke="#fff5e4" stroke-width="34" stroke-linecap="round" stroke-dasharray="0 7.14" pathLength="100" />
                <path d="M 75 166 A 125 35 0 0 1 325 166" fill="none" stroke="#f05d54" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 7.14" stroke-dashoffset="-3.57" pathLength="100" />
                <path d="M 69 325 A 131 35 0 0 0 331 325" fill="none" stroke="#fff5e4" stroke-width="34" stroke-linecap="round" stroke-dasharray="0 7.14" pathLength="100" />
                <path d="M 75 311 A 125 35 0 0 0 325 311" fill="none" stroke="#f05d54" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 7.14" stroke-dashoffset="-3.57" pathLength="100" />

                <rect x="132" y="90" width="16" height="80" fill="#f5d045" rx="3" ry="3"/>
                <rect x="132" y="90" width="16" height="80" fill="url(#stripe-right)" rx="3" ry="3"/>

                <rect x="192" y="80" width="16" height="90" fill="url(#stripe-right)" rx="3" ry="3"/>

    <!-- The Reveal Container -->
    <div class="reveal-container">
        <!-- Sticker Window -->
        <div class="surprise-sticker"></div>
        <!-- Button -->
        <a href="notepage.html" class="btn-link">
            <span class="btn-text">Open Your Gift &rarr;</span>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // --- CINEMATIC LOAD FADE OUT ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('cinematic-loader').classList.add('hidden');
            }, 1200); 
        });

        // --- SWIPE TO SLICE LOGIC ---
        const cakeContainer = document.getElementById('cake-container');
        const sliceLine = document.getElementById('slice-line');
        const prompt = document.getElementById('prompt');
        
        let isSwiping = false;
        let isCut = false;
        let startY = 0;
        let startX = 0;

        function startSwipe(e) {
            if (isCut) return;
            isSwiping = true;
            
            startY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = e.touches ? e.touches[0].clientX : e.clientX;
            
            sliceLine.style.left = `${startX}px`;
            sliceLine.style.top = `${startY}px`;
            sliceLine.style.height = '0px';
            sliceLine.style.opacity = '1';
        }

        function trackSwipe(e) {
            if (!isSwiping || isCut) return;
            
            let currentY = e.touches ? e.touches[0].clientY : e.clientY;
            
            if (currentY > startY) {
                sliceLine.style.height = `${currentY - startY}px`;
            }

            if (currentY - startY > 180) {
                triggerCut();
            }
        }

        function endSwipe() {
            isSwiping = false;
            if (!isCut) {
                sliceLine.style.opacity = '0'; 
            }
        }

        function launchFireworks() {
            const duration = 4000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { 
                    particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
                }));
                confetti(Object.assign({}, defaults, { 
                    particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
                }));
            }, 250);
        }

        function triggerCut() {
            isCut = true;
            isSwiping = false;
            
            sliceLine.style.opacity = '0';
            prompt.style.animation = 'none';
            prompt.style.opacity = '0';

            document.body.classList.add('party-mode');

            if ("vibrate" in navigator) {
                navigator.vibrate([100, 50, 200]); 
            }

            setTimeout(() => {
                launchFireworks();
            }, 300);
        }

        cakeContainer.addEventListener('mousedown', startSwipe);
        window.addEventListener('mousemove', trackSwipe);
        window.addEventListener('mouseup', endSwipe);

        cakeContainer.addEventListener('touchstart', startSwipe, { passive: true });
        window.addEventListener('touchmove', trackSwipe, { passive: true });
        window.addEventListener('touchend', endSwipe);

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function (e) {
            if (e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
               (e.ctrlKey && e.keyCode === 85)) {
                return false;
            }
        };
    </script>
</body>
